<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; background: transparent; overflow: hidden;
      user-select: none; cursor: grab;
    }
    body.dragging { cursor: grabbing; }
    video { display: none; position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; }
    canvas { display: block; position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    #bubble {
      position: absolute; top: 4px; left: 50%; transform: translateX(-50%);
      background: rgba(255,255,255,0.96); border-radius: 12px; padding: 7px 10px;
      font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; color: #2D3436;
      max-width: calc(100% - 12px); box-shadow: 0 3px 12px rgba(0,0,0,0.12);
      opacity: 0; pointer-events: none; transition: opacity 0.25s; z-index: 10; white-space: nowrap;
    }
    #bubble.show { opacity: 1; }
    #status {
      position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%);
      max-width: calc(100% - 12px); padding: 6px 9px; border-radius: 9px;
      background: rgba(45,52,54,0.88); color: white; font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 10px; line-height: 1.25; text-align: center; pointer-events: none; z-index: 12; display: none;
    }
  </style>
</head>
<body title="Click for controls · Drag to move">
  <video id="petVideo" muted playsinline></video>
  <canvas id="petCanvas"></canvas>
  <div id="bubble"></div>
  <div id="status"></div>
  <script src="video-pet.js"></script>
</body>
</html>
